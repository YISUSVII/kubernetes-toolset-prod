apiVersion: v1
kind: Pod
metadata:
  name: multi-container-app
  labels:
    app: multi-container-demo
spec:
  # Main application container
  containers:
  - name: app
    image: nginx:1.21-alpine
    ports:
    - containerPort: 80
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx
    - name: html
      mountPath: /usr/share/nginx/html
  
  # Sidecar: Log processor
  - name: log-processor
    image: busybox:1.35
    command: ["/bin/sh"]
    args:
    - -c
    - |
      while true; do
        if [ -f /var/log/nginx/access.log ]; then
          tail -f /var/log/nginx/access.log | while read line; do
            echo "[PROCESSED] $line"
          done
        fi
        sleep 5
      done
    resources:
      requests:
        memory: "32Mi"
        cpu: "50m"
      limits:
        memory: "64Mi"
        cpu: "100m"
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx
      readOnly: true
  
  # Sidecar: Metrics exporter
  - name: metrics-exporter
    image: nginx/nginx-prometheus-exporter:0.11
    args:
    - -nginx.scrape-uri=http://localhost:80/stub_status
    ports:
    - containerPort: 9113
      name: metrics
    resources:
      requests:
        memory: "32Mi"
        cpu: "50m"
      limits:
        memory: "64Mi"
        cpu: "100m"
  
  # Init Container: Setup
  initContainers:
  - name: init-setup
    image: busybox:1.35
    command: ['sh', '-c']
    args:
    - |
      echo "Initializing application..."
      echo "<h1>Hello from Multi-Container Pod!</h1>" > /html/index.html
      echo "Setup complete!"
    volumeMounts:
    - name: html
      mountPath: /html
  
  # Shared volumes
  volumes:
  - name: shared-logs
    emptyDir: {}
  - name: html
    emptyDir: {}
