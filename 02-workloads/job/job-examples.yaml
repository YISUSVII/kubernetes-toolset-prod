# Job Examples - Batch Processing

---
# 1. SIMPLE ONE-OFF JOB
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pi-calculation
  namespace: default
  labels:
    app: math-batch
spec:
  # Job terminates after 4 successful completions
  completions: 4
  
  # Execute 2 pods in parallel
  parallelism: 2
  
  # Retry limit
  backoffLimit: 4
  
  # Clean up finished job after 100 seconds
  ttlSecondsAfterFinished: 100
  
  template:
    metadata:
      labels:
        app: math-batch
    spec:
      containers:
      - name: pi
        image: perl:5.34
        command: ["perl",  "-Mbignum=bpi", "-wle", "print bpi(2000)"]
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      restartPolicy: OnFailure

---
# 2. WORK QUEUE JOB (Indexed Job)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: image-processor
  namespace: default
spec:
  completions: 5
  parallelism: 2
  completionMode: Indexed  # Each pod gets a unique index (0-4)
  
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.35
        command:
        - "sh"
        - "-c"
        - |
          echo "Processing item $JOB_COMPLETION_INDEX"
          sleep 5
          echo "Finished item $JOB_COMPLETION_INDEX"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        env:
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']

---
# 3. JOB WITH DEADLINE
---
apiVersion: batch/v1
kind: Job
metadata:
  name: time-limited-job
spec:
  # Terminate if not finished in 60 seconds
  activeDeadlineSeconds: 60
  backoffLimit: 2
  
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.36
        args:
        - /bin/sh
        - -c
        - "echo 'Working...'; sleep 30; echo 'Done'"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
