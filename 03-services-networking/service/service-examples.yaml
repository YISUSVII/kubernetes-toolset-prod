# Service Examples

---
# 1. CLUSTER IP (Internal Communication)
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: default
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - name: http
    port: 80        # Port exposed by the Service
    targetPort: 8080 # Port on the Container
    protocol: TCP

---
# 2. NODE PORT (External Access via Node IP)
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-nodeport
  namespace: default
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080  # Static port in range 30000-32767

---
# 3. LOAD BALANCER (Cloud Provider Integration)
---
apiVersion: v1
kind: Service
metadata:
  name: public-lb
  namespace: default
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: public-web
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443

---
# 4. EXTERNAL NAME (DNS Alias)
---
apiVersion: v1
kind: Service
metadata:
  name: external-db
  namespace: default
spec:
  type: ExternalName
  externalName: db.example.com

---
# 5. HEADLESS SERVICE (StatefulSet Discovery)
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-headless
  labels:
    app: mongo
spec:
  clusterIP: None  # This makes it headless
  selector:
    app: mongo
  ports:
  - port: 27017
    targetPort: 27017

---
# 6. TRAFFIC DISTRIBUTION (Topology-aware routing, GA in v1.35)
# PreferSameZone: routes traffic to endpoints in the same zone when available
# PreferSameNode: routes traffic to endpoints on the same node when available
# NOTE: PreferClose is deprecated in v1.35; use PreferSameZone instead
---
apiVersion: v1
kind: Service
metadata:
  name: zone-aware-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  trafficDistribution: PreferSameZone  # Prefer endpoints in the same zone (replaces deprecated PreferClose)
