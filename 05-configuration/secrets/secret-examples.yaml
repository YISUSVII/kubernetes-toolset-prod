# Secret Examples
# NOTE: In real usage, use SealedSecrets or External Secrets Operator
# Values here are base64 encoded

---
# 1. OPAQUE SECRET (Generic)
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: default
type: Opaque
data:
  # username: admin (YWRtaW4=)
  username: YWRtaW4=
  # password: secretpassword (c2VjcmV0cGFzc3dvcmQ=)
  password: c2VjcmV0cGFzc3dvcmQ=

---
# 2. TLS SECRET
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-cert
  namespace: default
type: kubernetes.io/tls
data:
  # Base64 encoded PEM certificate
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCi4uLgotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0tCg==
  # Base64 encoded private key
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCi4uLgotLS0tLUVORCBQUklWQVRFIEtFWS0tLS0tCg==

---
# 3. DOCKER REGISTRY SECRET
---
apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: default
type: kubernetes.io/dockerconfigjson
data:
  # .dockerconfigjson base64 encoded
  .dockerconfigjson: ewogICJhdXRocyI6IHsKICAgICJodHRwczovL2luZGV4LmRvY2tlci5pby92MS8iOiB7CiAgICAgICJhdXRoIjogImQzbGK=

---
# 4. STRING DATA (Convenience - Auto encoded)
---
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  namespace: default
type: Opaque
stringData:
  # You can write plain text here, Kubernetes encodes it for you
  stripe-key: "sk_test_123456789"
  aws-key: "AKIAIOSFODNN7EXAMPLE"
