# Pod Security Standards (PSS) & Admission
# Note: PodSecurityPolicy (PSP) is deprecated in v1.21+ and removed in v1.25+
# Use Pod Security Admission (PSA) via Namespace labels

---
# 1. NAMESPACE WITH RESTRICTED POLICY
---
apiVersion: v1
kind: Namespace
metadata:
  name: restricted-namespace
  labels:
    # Enforce: Reject pods that violate the policy
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    
    # Audit: Log violations but allow them
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    
    # Warn: Show warning to user but allow
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest

---
# 2. NAMESPACE WITH BASELINE POLICY
---
apiVersion: v1
kind: Namespace
metadata:
  name: baseline-namespace
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest

---
# 3. NAMESPACE WITH PRIVILEGED POLICY (Default)
---
apiVersion: v1
kind: Namespace
metadata:
  name: privileged-namespace
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest

---
# 4. COMPLIANT POD (Restricted)
---
apiVersion: v1
kind: Pod
metadata:
  name: compliant-pod
  namespace: restricted-namespace
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: nginx
    image: nginx:alpine
    securityContext:
      allowPrivilegeEscalation: false
      runAsUser: 1000
      capabilities:
        drop:
        - ALL
