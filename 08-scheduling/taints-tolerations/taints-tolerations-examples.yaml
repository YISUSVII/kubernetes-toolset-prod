# Taints and Tolerations Examples

---
# 1. POD WITH TOLERATION
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    env: test
spec:
  containers:
  - name: nginx
    image: nginx:1.25
    imagePullPolicy: IfNotPresent
  
  tolerations:
  # Tolerate "dedicated=experimental:NoSchedule" taint
  - key: "dedicated"
    operator: "Equal"
    value: "experimental"
    effect: "NoSchedule"
  
  # Tolerate any taint with key "gpu"
  - key: "gpu"
    operator: "Exists"
    effect: "NoSchedule"

---
# 2. EVICTION TOLERATION (Time-based)
---
apiVersion: v1
kind: Pod
metadata:
  name: toleration-seconds
spec:
  containers:
  - name: nginx
    image: nginx:1.25
  tolerations:
  - key: "node.kubernetes.io/unreachable"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 6000 # Stay for 6000s after node becomes unreachable

---
# 3. NUMERIC COMPARISON TOLERATIONS (New in v1.35)
# Gt (Greater Than) and Lt (Less Than) operators allow numeric comparisons
# Useful for tolerating taints that represent numeric thresholds (e.g., battery level, temperature)
---
apiVersion: v1
kind: Pod
metadata:
  name: numeric-toleration-demo
spec:
  containers:
  - name: nginx
    image: nginx:1.25
  tolerations:
  # Tolerate nodes where battery-level taint value is greater than 20
  - key: "battery-level"
    operator: "Gt"
    value: "20"
    effect: "NoSchedule"
  # Tolerate nodes where temperature taint value is less than 80
  - key: "temperature"
    operator: "Lt"
    value: "80"
    effect: "NoSchedule"
