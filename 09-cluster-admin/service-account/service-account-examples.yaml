# Service Account Examples

---
# 1. SIMPLE SERVICE ACCOUNT
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-robot
  namespace: default
  labels:
    app: builder

---
# 2. SERVICE ACCOUNT WITH IMAGE PULL SECRETS
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: private-registry-sa
  namespace: default
imagePullSecrets:
- name: myregistrykey

---
# 3. SERVICE ACCOUNT FOR POD IDENTITY (Workload Identity)
# Example annotation for cloud provider IAM integration (e.g., AWS IRSA, GKE Workload Identity)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-reader
  namespace: default
  annotations:
    # AWS Example
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/s3-reader-role
    # GCP Example
    # iam.gke.io/gcp-service-account: my-sa@my-project.iam.gserviceaccount.com
